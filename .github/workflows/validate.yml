name: Validate manual capture data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check capture scripts
        working-directory: capture
        run: |
          node --check capture.mjs
          node --check manual-impact.mjs

      - name: Validate recipes, generated content and shots
        working-directory: capture
        run: node manual-impact.mjs validate
