<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>操作マニュアル | 宇多津会衆PWアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css?v=3">
</head>
<body>

<header class="hdr">
  <span class="hdr-title">📖 操作マニュアル</span>
</header>

<div class="wrap" style="padding-top:16px;padding-bottom:32px;">

  <p class="lead">
    ご自分にあてはまるものを選んでください。<br>
    画面の写真を見ながら、1つずつ進められます。
  </p>

  <div id="picks">

  <a class="pick" href="walkthrough.html#/volunteer">
    <span class="pick-icon">🙋</span>
    <span class="pick-body">
      <span class="pick-name">奉仕者の方</span>
      <span class="pick-sub">シフト希望の出し方、シフト表の見方など</span>
    </span>
    <span class="pick-arr">›</span>
  </a>

  <a class="pick" href="walkthrough.html#/responsible" data-need="isResponsible" hidden>
    <span class="pick-icon">📋</span>
    <span class="pick-body">
      <span class="pick-name">責任者の方</span>
      <span class="pick-sub">シフトの中止、責任者メモ、奉仕者の入れ替え</span>
    </span>
    <span class="pick-arr">›</span>
  </a>

  <a class="pick" href="walkthrough.html#/accountant" data-need="isAccountant" hidden>
    <span class="pick-icon">📄</span>
    <span class="pick-body">
      <span class="pick-name">会計者の方</span>
      <span class="pick-sub">道路使用許可書PDFの登録・差し替え</span>
    </span>
    <span class="pick-arr">›</span>
  </a>

  <a class="pick" href="walkthrough.html#/admin" data-need="isAdmin" hidden>
    <span class="pick-icon">⚙️</span>
    <span class="pick-body">
      <span class="pick-name">区域係の方</span>
      <span class="pick-sub">月の準備、シフト作成・公開、メンバー管理</span>
    </span>
    <span class="pick-arr">›</span>
  </a>

  </div><!-- /#picks -->

  <div class="sec-title">そのほか</div>

  <a class="pick" href="reference.html">
    <span class="pick-icon">🎨</span>
    <span class="pick-body">
      <span class="pick-name">色や記号の意味を調べる</span>
      <span class="pick-sub">画面の色分け・バッジ・用語・よくある質問</span>
    </span>
    <span class="pick-arr">›</span>
  </a>

  <div class="note note-info" style="margin-top:20px;">
    <span class="note-icon">ℹ️</span>
    <span>操作が分からないときや、うまくいかないときは区域係にご連絡ください。</span>
  </div>

</div>

<script src="js/index.js?v=1"></script>
</body>
</html>
